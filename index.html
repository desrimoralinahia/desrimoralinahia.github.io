<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Mini Library Desri</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #0a0f1c; /* hitam kebiruan */
            color: white;
        }

        /* NAVBAR */
        .navbar {
            background-color: #0b1c2d; /* navy */
            padding: 15px 0;
        }

        .navbar ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }

        .navbar ul li {
            margin: 0 25px;
        }

        .navbar ul li a {
            color: #ffffff;
            text-decoration: none;
            font-size: 17px;
            font-weight: bold;
        }

        .navbar ul li a:hover {
            color: #4da6ff;
        }

        /* JUDUL */
        .hero {
            text-align: center;
            margin-top: 120px;
        }

        .hero h1 {
            font-size: 60px;
            color: #4da6ff;
            margin-bottom: 10px;
        }

        .hero p {
            font-size: 18px;
            color: #d0d6e0;
        }
    </style>
</head>
<body>

<!-- MENU -->
<nav class="navbar">
    <ul>
        <li><a href="#">Beranda</a></li>
        <li><a href="#">Koleksi Buku</a></li>
        <li><a href="#">Layanan Informasi</a></li>
        <li><a href="#">Tentang Saya</a></li>
    </ul>
</nav>

<!-- BERANDA -->
<div class="hero">
    <h1>Mini Library Desri</h1>
    <p>Website Perpustakaan Personal</p>
</div>

</body>
</html>
