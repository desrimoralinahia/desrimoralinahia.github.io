<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Desri Mini Library</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #0a0f1c;
            color: white;
        }

        /* NAVBAR */
        .navbar {
            background-color: #0b1c2d;
            padding: 15px 0;
        }

        .navbar ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }

        .navbar ul li {
            margin: 0 25px;
        }

        .navbar ul li a {
            color: white;
            text-decoration: none;
            font-size: 17px;
            font-weight: bold;
        }

        .navbar ul li a:hover {
            color: #4da6ff;
        }

        /* HERO */
        .hero {
            text-align: center;
            margin-top: 100px;
            padding: 0 20px;
        }

        .hero h1 {
            font-size: 60px;
            color: #4da6ff;
            margin-bottom: 15px;
        }

        .hero h2 {
            font-size: 26px;
            margin-bottom: 10px;
        }

        .hero p {
            font-size: 18px;
            color: #d0d6e0;
            max-width: 700px;
            margin: auto;
        }
    </style>
</head>
<body>

<!-- MENU -->
<nav class="navbar">
    <ul>
        <li><a href="#">Beranda</a></li>
        <li><a href="#">Koleksi Buku</a></li>
        <li><a href="#">Layanan Informasi</a></li>
        <li><a href="#">Tentang Saya</a></li>
    </ul>
</nav>

<!-- BERANDA -->
<div class="hero">
    <h1>Mini Library Desri</h1>
    <h2>Welcome to My Personal Library</h2>
    <p>
        Selamat datang di Mini Library Desri, sebuah website perpustakaan personal
        yang menyediakan informasi koleksi buku dan layanan informasi perpustakaan
        dalam bentuk web sederhana.
    </p>
</div>

</body>
</html>
